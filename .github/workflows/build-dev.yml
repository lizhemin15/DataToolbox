name: Build Dev

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    name: Build Test for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build gov-runner
        run: |
          cd gov-runner
          bun install
          case "${{ matrix.goos }}-${{ matrix.goarch }}" in
            linux-amd64) bun build --compile ./index.ts --outfile gov-runner --target=bun-linux-x64 ;;
            windows-amd64) bun build --compile ./index.ts --outfile gov-runner.exe --target=bun-windows-x64 ;;
            darwin-amd64) bun build --compile ./index.ts --outfile gov-runner --target=bun-darwin-x64 ;;
            *) echo "Skipping gov-runner for this platform" ;;
          esac
          cd ..

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w" -o datatoolbox-server.exe .
          else
            go build -ldflags="-s -w" -o datatoolbox-server .
          fi

      - name: Test build success
        run: |
          echo "✅ Build successful for ${{ matrix.goos }}-${{ matrix.goarch }}"
