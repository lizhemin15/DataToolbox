name: Build Dev

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    name: Build Test for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Run Go unit tests (linux-amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -tags=nogov ./... -count=1

      - name: Run JS parser tests (linux-amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          for f in tests/js/*.test.js; do
            echo "== $f"
            node "$f"
          done

      - name: Check user manual is up to date (linux-amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet python-docx
          python3 docs/manual/build_manual.py || true
          if ! git diff --quiet -- docs/使用说明书.docx; then
            echo "::warning::docs/使用说明书.docx 与 docs/manual/build_manual.py 不一致，请重新生成并提交（功能更新后说明书要同步更新）"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w -X main.Version=dev-$(echo ${{ github.sha }} | cut -c1-7)" -tags=nogov -o datatoolbox-server.exe .
          else
            go build -ldflags="-s -w -X main.Version=dev-$(echo ${{ github.sha }} | cut -c1-7)" -tags=nogov -o datatoolbox-server .
          fi

      - name: Test build success
        run: |
          echo "✅ Build successful for ${{ matrix.goos }}-${{ matrix.goarch }}"
