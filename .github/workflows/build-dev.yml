name: Build Dev

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    name: Build Test for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w -X main.Version=dev-$(echo ${{ github.sha }} | cut -c1-7)" -tags=nogov -o datatoolbox-server.exe .
          else
            go build -ldflags="-s -w -X main.Version=dev-$(echo ${{ github.sha }} | cut -c1-7)" -tags=nogov -o datatoolbox-server .
          fi

      - name: Test build success
        run: |
          echo "✅ Build successful for ${{ matrix.goos }}-${{ matrix.goarch }}"
