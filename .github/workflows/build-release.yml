name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的tag时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Windows
          - goos: windows
            goarch: amd64
            output: datatoolbox-server.exe
            package: datatoolbox-windows-amd64.zip
          
          - goos: windows
            goarch: arm64
            output: datatoolbox-server.exe
            package: datatoolbox-windows-arm64.zip
          
          # Linux（CGO 启用，用于 SQLite 等）
          - goos: linux
            goarch: amd64
            output: datatoolbox-server
            package: datatoolbox-linux-amd64.tar.gz
          
          - goos: linux
            goarch: arm64
            output: datatoolbox-server
            package: datatoolbox-linux-arm64.tar.gz
          
          # macOS
          - goos: darwin
            goarch: amd64
            output: datatoolbox-server
            package: datatoolbox-macos-amd64.tar.gz
          
          - goos: darwin
            goarch: arm64
            output: datatoolbox-server
            package: datatoolbox-macos-arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Inject version into source static files (for embed)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$VERSION" ]; then
            for f in apps/data-ontology/index.html apps/data-ontology/script.js; do
              if [ -f "$f" ]; then
                sed -i "s/?v=[0-9]\+\.[0-9]\+\.[0-9]\+/?v=${VERSION}/g" "$f"
                echo "  PATCHED: $f -> v=${VERSION}"
              fi
            done
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go mod tidy
          # gov-runner 嵌入的是构建机器架构（x86_64）
          # 非 amd64 架构需要用 nogov tag，让 gov-runner 作为独立文件
          if [ "${{ matrix.goos }}" = "windows" ] || [ "${{ matrix.goarch }}" != "amd64" ]; then
            go build -tags release,nogov -ldflags="-s -w" -o ${{ matrix.output }} .
          else
            go build -tags release -ldflags="-s -w" -o ${{ matrix.output }} .
          fi

      - name: Prepare package files
        run: |
          mkdir -p package
          # 静态文件直接放在包根目录，与可执行文件同级
          # 消除 web 子目录冗余，静态文件和配置文件（apps/data-ontology/data-store.json）统一位置
          cp ${{ matrix.output }} package/
          cp server.config.json package/
          cp scripts/install.sh package/install.sh
          cp scripts/update.sh package/update.sh
          cp README_DEPLOY.md package/
          chmod +x package/install.sh
          chmod +x package/update.sh
          # 复制静态文件到包根目录
          cp -r index.html apps css js lib examples package/
          # 注入版本号：替换静态资源 URL 中的 ?v=X.Y.Z
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$VERSION" ]; then
            for f in package/apps/data-ontology/index.html package/apps/data-ontology/script.js; do
              if [ -f "$f" ]; then
                sed -i "s/?v=[0-9]\+\.[0-9]\+\.[0-9]\+/?v=${VERSION}/g" "$f"
                echo "  PATCHED: $f -> v=${VERSION}"
              fi
            done
          fi
          # 复制 gov-runner（仅 amd64 架构，因为嵌入的是 x86_64 版本）
          # ARM 等其他架构需要用户自行提供正确版本的 gov-runner
          if [ "${{ matrix.goarch }}" = "amd64" ] && [ "${{ matrix.goos }}" != "windows" ]; then
            if [ -f "gov-runner" ]; then
              cp gov-runner package/
              chmod +x package/gov-runner
            else
              echo "Warning: gov-runner not found, skipping"
            fi
          fi

      - name: Create startup script for Windows
        if: matrix.goos == 'windows'
        run: |
          cat > package/start.bat << 'EOF'
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          echo ====================================
          echo DataToolbox 服务器
          echo ====================================
          echo.
          if "%1"=="" (
              datatoolbox-server.exe
          ) else (
              datatoolbox-server.exe -port %1
          )
          pause
          EOF

      - name: Create startup script for Unix
        if: matrix.goos != 'windows'
        run: |
          cat > package/start.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          echo "===================================="
          echo "DataToolbox 服务器"
          echo "===================================="
          echo ""
          if [ -z "$1" ]; then
              ./datatoolbox-server
          else
              ./datatoolbox-server -port "$1"
          fi
          EOF
          chmod +x package/start.sh
          chmod +x package/datatoolbox-server

      - name: Create ZIP package (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd package
          zip -r ../${{ matrix.package }} .

      - name: Create TAR.GZ package (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd package
          tar -czf ../${{ matrix.package }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## DataToolbox Server Release
            
            ### 📦 下载说明
            
            根据你的系统选择对应的包：
            
            - **Windows (64位 Intel/AMD)**: `datatoolbox-windows-amd64.zip`
            - **Windows (ARM64)**: `datatoolbox-windows-arm64.zip`
            - **Linux (64位)**: `datatoolbox-linux-amd64.tar.gz`
            - **Linux (ARM64)**: `datatoolbox-linux-arm64.tar.gz`
            - **macOS (Intel)**: `datatoolbox-macos-amd64.tar.gz`
            - **macOS (Apple Silicon)**: `datatoolbox-macos-arm64.tar.gz`
            
            ### 📁 目录结构
            
            解压后目录结构：
            ```
            datatoolbox/
            ├── datatoolbox-server    # 可执行文件
            ├── index.html            # 主页（静态文件）
            ├── apps/                 # 应用目录（含配置文件）
            │   └── data-ontology/
            │       ├── script.js     # 前端脚本
            │       └── data-store.json  # 配置文件（服务端读写）
            ├── css/                  # 样式文件
            ├── js/                   # JavaScript 库
            ├── lib/                  # 第三方库
            ├── gov-runner            # 治理任务运行器
            ├── server.config.json    # 服务器配置
            ├── install.sh            # 安装脚本
            └── update.sh             # 更新脚本
            ```
            
            **注意**：静态文件和配置文件统一在 `apps/` 目录，更新前端只需修改一处。
            
            ### 🚀 使用方法
            
            **交互式安装（推荐）：** 解压后执行 `chmod +x install.sh && ./install.sh`，详见包内 `README_DEPLOY.md`。
            
            **默认端口8080启动：**
            - Windows: 双击运行 `start.bat`
            - Linux/macOS: 运行 `./start.sh`
            
            **自定义端口启动：**
            - Windows: `start.bat 3000` 或 `datatoolbox-server.exe -port 3000`
            - Linux/macOS: `./start.sh 3000` 或 `./datatoolbox-server -port 3000`
            
            **修改默认端口：**
            编辑 `server.config.json`
            ```json
            {
              "port": 8080,
              "host": "0.0.0.0"
            }
            ```
            
            **Linux 持久运行且开机自启（解压包内含 `datatoolbox.service`）：**
            1. 解压到目录，如 `/opt/datatoolbox`（若用其他目录需先改 `datatoolbox.service` 里的 WorkingDirectory 和 ExecStart）
            2. `sudo cp /opt/datatoolbox/datatoolbox.service /etc/systemd/system/`
            3. `sudo systemctl daemon-reload && sudo systemctl enable --now datatoolbox`
            之后关掉终端或重启服务器都会自动运行；查看状态：`sudo systemctl status datatoolbox`，日志：`journalctl -u datatoolbox -f`
            
            **Linux 更新版本：**
            1. 下载新版本 tar.gz 包
            2. 执行更新脚本：`sudo ./update.sh datatoolbox-linux-amd64.tar.gz`
            
            或手动更新：
            1. 停止服务：`sudo systemctl stop datatoolbox`
            2. 解压新版本到临时目录
            3. 备份后替换：二进制 + 前端文件（index.html, apps/, css/, js/, lib/）
            4. 启动服务：`sudo systemctl start datatoolbox`
            
            **⚠️ 注意**：更新时必须同时替换前端文件，否则新功能不会生效！
            
            **Linux 停止服务 / 取消开机自启：**
            - 仅停止：`sudo systemctl stop datatoolbox`
            - 取消开机自启并停止：`sudo systemctl disable --now datatoolbox`
            
            启动后访问: http://localhost:端口号
