<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用广场 - 数据工具箱</title>
    <link rel="stylesheet" href="style.css?v=20260521">
    <style>
        /* Open Design 风格 - 应用广场 */
        .apps-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
        }

        .apps-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .apps-header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .apps-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .apps-nav {
            display: flex;
            gap: 8px;
        }

        .apps-nav a {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .apps-nav a:hover {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
        }

        .apps-nav a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .apps-header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-create-app {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-create-app:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .apps-hero {
            text-align: center;
            padding: 60px 40px;
            color: white;
        }

        .apps-hero h2 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 16px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .apps-hero p {
            font-size: 18px;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .apps-search-box {
            max-width: 500px;
            margin: 30px auto 0;
            position: relative;
        }

        .apps-search-box input {
            width: 100%;
            padding: 16px 24px 16px 50px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .apps-search-box input:focus {
            outline: none;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        .apps-search-box::before {
            content: "🔍";
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .apps-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .apps-category {
            margin-bottom: 40px;
        }

        .apps-category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .apps-category-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .apps-category-title span {
            font-size: 24px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .app-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        .app-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .app-card-gradient {
            height: 120px;
            background: linear-gradient(135deg, var(--gradient-start, #667eea) 0%, var(--gradient-end, #764ba2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .app-card-gradient::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(-30%, -30%); }
            50% { transform: translate(30%, 30%); }
        }

        .app-card-icon {
            font-size: 48px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            position: relative;
            z-index: 1;
        }

        .app-card-body {
            padding: 20px;
        }

        .app-card-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .app-card-desc {
            font-size: 14px;
            color: #718096;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .app-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .app-card-tag {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .app-card-footer {
            padding: 16px 20px;
            border-top: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-card-stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #a0aec0;
        }

        .app-card-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .app-card-action {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .app-card-action:hover {
            transform: scale(1.05);
        }

        /* 自定义应用卡片样式 */
        .app-card.custom-app .app-card-gradient {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .app-card.custom-app::after {
            content: "自定义";
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #f5576c;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            z-index: 10;
        }

        /* 空状态 */
        .apps-empty {
            text-align: center;
            padding: 80px 40px;
            color: white;
        }

        .apps-empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .apps-empty h3 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .apps-empty p {
            opacity: 0.8;
            margin-bottom: 24px;
        }

        /* 加载动画 */
        .apps-loading {
            display: flex;
            justify-content: center;
            padding: 60px;
        }

        .apps-loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .apps-header {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .apps-header-left {
                flex-direction: column;
                width: 100%;
            }

            .apps-nav {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 8px;
            }

            .apps-hero {
                padding: 40px 20px;
            }

            .apps-hero h2 {
                font-size: 28px;
            }

            .apps-container {
                padding: 20px;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="apps-page">
        <!-- 头部导航 -->
        <header class="apps-header">
            <div class="apps-header-left">
                <h1>🏪 应用广场</h1>
                <nav class="apps-nav">
                    <a href="index.html">首页</a>
                    <a href="apps.html" class="active">应用广场</a>
                    <a href="apps/data-ontology/index.html">数据本体池</a>
                </nav>
            </div>
            <div class="apps-header-actions">
                <button class="btn-create-app" onclick="window.location.href='app-editor.html'">
                    ✨ 创建应用
                </button>
            </div>
        </header>

        <!-- Hero 区域 -->
        <div class="apps-hero">
            <h2>发现更多可能</h2>
            <p>探索丰富的数据处理工具和应用，或创建属于你自己的应用</p>
            <div class="apps-search-box">
                <input type="text" id="searchInput" placeholder="搜索应用名称、关键词..." oninput="filterApps()">
            </div>
        </div>

        <!-- 应用列表 -->
        <div class="apps-container">
            <!-- 自定义应用 -->
            <div class="apps-category" id="customAppsSection" style="display: none;">
                <div class="apps-category-header">
                    <div class="apps-category-title">
                        <span>🎨</span> 我的应用
                    </div>
                </div>
                <div class="apps-grid" id="customAppsGrid">
                    <!-- 动态加载 -->
                </div>
            </div>

            <!-- 内置应用 -->
            <div class="apps-category">
                <div class="apps-category-header">
                    <div class="apps-category-title">
                        <span>📦</span> 内置应用
                    </div>
                </div>
                <div class="apps-grid" id="builtinAppsGrid">
                    <!-- 动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 应用数据
        let customApps = [];
        let builtinApps = [];

        // 认证辅助函数
        function getAuthToken() {
            return localStorage.getItem('dataOntologyToken') || '';
        }

        async function fetchWithAuth(url, options = {}) {
            const token = getAuthToken();
            const headers = { ...(options.headers || {}) };
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            if (options.body && !headers['Content-Type']) {
                headers['Content-Type'] = 'application/json';
            }
            const resp = await fetch(url, { ...options, headers });
            if (resp.status === 401) {
                alert('登录已过期，请重新登录');
                window.location.href = '/apps/data-ontology/';
                return resp;
            }
            return resp;
        }

        // 颜色渐变配置
        const gradients = [
            { start: '#667eea', end: '#764ba2' },
            { start: '#f093fb', end: '#f5576c' },
            { start: '#4facfe', end: '#00f2fe' },
            { start: '#43e97b', end: '#38f9d7' },
            { start: '#fa709a', end: '#fee140' },
            { start: '#a8edea', end: '#fed6e3' },
            { start: '#ff9a9e', end: '#fecfef' },
            { start: '#ffecd2', end: '#fcb69f' },
        ];

        // 页面加载
        document.addEventListener('DOMContentLoaded', async () => {
            await loadBuiltinApps();
            await loadCustomApps();
        });

        // 加载内置应用
        async function loadBuiltinApps() {
            try {
                const response = await fetch('apps/apps.json');
                builtinApps = await response.json();
                renderBuiltinApps();
            } catch (error) {
                console.error('加载内置应用失败:', error);
                document.getElementById('builtinAppsGrid').innerHTML = `
                    <div class="apps-empty">
                        <p>加载应用失败，请刷新页面重试</p>
                    </div>
                `;
            }
        }

        // 加载自定义应用
        async function loadCustomApps() {
            try {
                const response = await fetchWithAuth('/api/v1/apps');
                if (response.ok) {
                    const data = await response.json();
                    customApps = data.apps || [];
                    renderCustomApps();
                }
            } catch (error) {
                console.log('暂无自定义应用');
            }
        }

        // 渲染内置应用
        function renderBuiltinApps(apps = null) {
            const grid = document.getElementById('builtinAppsGrid');
            const list = apps || builtinApps;
            
            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="apps-empty">
                        <div class="apps-empty-icon">🔍</div>
                        <h3>未找到匹配的应用</h3>
                        <p>尝试其他关键词</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map((app, index) => {
                const gradient = gradients[index % gradients.length];
                return `
                    <div class="app-card" onclick="openApp('${app.id}')" 
                         style="--gradient-start: ${gradient.start}; --gradient-end: ${gradient.end}">
                        <div class="app-card-gradient">
                            <div class="app-card-icon">${app.icon}</div>
                        </div>
                        <div class="app-card-body">
                            <div class="app-card-title">${app.name}</div>
                            <div class="app-card-desc">${app.description}</div>
                            <div class="app-card-tags">
                                ${(app.keywords || []).slice(0, 3).map(k => `<span class="app-card-tag">${k}</span>`).join('')}
                            </div>
                        </div>
                        <div class="app-card-footer">
                            <div class="app-card-stats">
                                <span>📦 内置</span>
                            </div>
                            <button class="app-card-action" onclick="event.stopPropagation(); openApp('${app.id}')">
                                打开
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染自定义应用
        function renderCustomApps() {
            const section = document.getElementById('customAppsSection');
            const grid = document.getElementById('customAppsGrid');
            
            if (customApps.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            grid.innerHTML = customApps.map(app => `
                <div class="app-card custom-app" onclick="openCustomApp('${app.slug}')">
                    <div class="app-card-gradient">
                        <div class="app-card-icon">${app.icon || '🎨'}</div>
                    </div>
                    <div class="app-card-body">
                        <div class="app-card-title">${app.title || app.name}</div>
                        <div class="app-card-desc">${app.description || '自定义应用'}</div>
                    </div>
                    <div class="app-card-footer">
                        <div class="app-card-stats">
                            <span>👁️ ${app.view_count || 0}</span>
                        </div>
                        <button class="app-card-action" onclick="event.stopPropagation(); editCustomApp('${app.id}')">
                            编辑
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 打开内置应用
        function openApp(appId) {
            window.location.href = `apps/${appId}/index.html`;
        }

        // 打开自定义应用
        function openCustomApp(slug) {
            window.location.href = `/a/${slug}`;
        }

        // 编辑自定义应用
        function editCustomApp(appId) {
            window.location.href = `app-editor.html?id=${appId}`;
        }

        // 搜索过滤
        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                renderBuiltinApps();
                return;
            }

            const filtered = builtinApps.filter(app => 
                app.name.toLowerCase().includes(query) ||
                app.description.toLowerCase().includes(query) ||
                (app.keywords || []).some(k => k.toLowerCase().includes(query))
            );

            renderBuiltinApps(filtered);
        }
    </script>
</body>
</html>
